id = "local.subscription-usage"
name = "Subscription Usage"
version = "0.1.4"
min_herdr_version = "0.9.2"
description = "Hourly Claude Code and Codex subscription allowance in the sidebar"
platforms = ["linux", "macos"]

[[startup]]
command = ["/usr/bin/python3", "usage.py"]

[[events]]
on = "workspace.created"
command = ["/usr/bin/python3", "usage.py", "--cached"]

[[events]]
on = "workspace.closed"
command = ["/usr/bin/python3", "usage.py", "--cached"]

[[events]]
on = "workspace.moved"
command = ["/usr/bin/python3", "usage.py", "--cached"]

[[events]]
on = "workspace.reordered"
command = ["/usr/bin/python3", "usage.py", "--cached"]

# The Herdr server keeps running while clients detach and the machine sleeps,
# so startup alone misses those gaps. Focus and agent events refresh a stale
# cache when you come back. They publish only when the live sidebar is missing
# the rows or shows different text.
[[events]]
on = "workspace.focused"
command = ["/usr/bin/python3", "usage.py", "--if-stale"]

[[events]]
on = "tab.focused"
command = ["/usr/bin/python3", "usage.py", "--if-stale"]

[[events]]
on = "pane.focused"
command = ["/usr/bin/python3", "usage.py", "--if-stale"]

[[events]]
on = "pane.agent_status_changed"
command = ["/usr/bin/python3", "usage.py", "--if-stale"]

# A workspace closes without a workspace.closed event when its last pane
# exits, which takes the rows with it if it was first.
[[events]]
on = "pane.exited"
command = ["/usr/bin/python3", "usage.py", "--if-stale"]

[[actions]]
id = "refresh"
title = "Refresh subscription usage now"
command = ["/usr/bin/python3", "usage.py", "--refresh"]
