# Merge this section into ~/.config/herdr/config.toml; do not replace your config.
# Allow roughly 28 columns so usage and reset times fit.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$subscription_header", bold = true }],
  ["$claude_5h"],
  ["$claude_week"],
  ["$codex_primary"],
  ["$codex_secondary"],
  [{ token = "$usage_updated", dim = true }],
]
